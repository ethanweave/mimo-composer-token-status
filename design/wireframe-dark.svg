<svg xmlns="http://www.w3.org/2000/svg" width="720" height="200" viewBox="0 0 720 200" role="img" aria-label="Composer footer wireframe dark: cache and remaining centered">
  <rect width="720" height="200" fill="#0b0b0c"/>
  <!-- composer card -->
  <rect x="48" y="28" width="624" height="128" rx="16" fill="#141416" stroke="#2a2a2e" stroke-width="1"/>
  <!-- placeholder -->
  <text x="72" y="58" fill="#6b6b70" font-family="ui-sans-serif, system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13">描述任务，输入/调用技能</text>
  <!-- footer row controls -->
  <circle cx="80" cy="128" r="11" fill="#1c1c1f" stroke="#2e2e33"/>
