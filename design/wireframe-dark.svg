  <rect x="108" y="116" width="92" height="24" rx="12" fill="#1c1c1f" stroke="#2e2e33"/>
  <text x="154" y="132" text-anchor="middle" fill="#c4c4c8" font-size="11" font-family="ui-sans-serif, system-ui, 'PingFang SC', sans-serif">完全访问</text>
  <!-- CENTER STATUS -->
  <line x1="300" y1="128" x2="420" y2="128" stroke="#1a1a1d"/>
  <text x="360" y="132" text-anchor="middle" fill="#8e8e93" font-size="11" font-family="ui-sans-serif, system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif">缓存 96% · 剩余 38%</text>
  <line x1="300" y1="128" x2="420" y2="128" stroke="none"/>
  <!-- right cluster -->
  <circle cx="520" cy="128" r="7" fill="none" stroke="#5a5a60" stroke-width="1.5"/>
  <text x="552" y="132" fill="#c4c4c8" font-size="11" font-family="ui-sans-serif, system-ui, sans-serif">Smart</text>
  <circle cx="600" cy="128" r="10" fill="#1c1c1f" stroke="#2e2e33"/>
  <circle cx="640" cy="128" r="14" fill="#3a3a40"/>
  <text x="640" y="132" text-anchor="middle" fill="#e8e8ea" font-size="12" font-family="ui-sans-serif, system-ui, sans-serif">↑</text>
  <!-- baseline guide -->
